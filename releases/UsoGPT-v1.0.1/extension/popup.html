<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UsoGPT - ChatGPT e Claude</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>UsoGPT <small id="extension-version"></small></h1>
      <div class="header-controls">
        <button id="settings-toggle" class="icon-btn" title="Configurações">⚙️</button>
        <button id="theme-toggle" class="icon-btn" title="Tema">Tema</button>
        <button id="refresh" class="icon-btn" title="Atualizar">↻</button>
      </div>
    </div>

    <!-- Painel de Configurações -->
    <div id="settings-panel" class="settings-panel hidden">
      <h3>Badge do ChatGPT</h3>
      <div class="setting-item">
        <label>
          <input type="radio" name="badge-metric" value="primary" checked>
          <span>Limite 5 Horas</span>
        </label>
      </div>
      <div class="setting-item">
        <label>
          <input type="radio" name="badge-metric" value="secondary">
          <span>Limite 7 Dias</span>
        </label>
      </div>
      <button id="save-settings" class="save-btn">Salvar</button>
    </div>

    <div id="content">
      <section class="provider-section" aria-labelledby="chatgpt-title">
        <h2 id="chatgpt-title" class="provider-title">ChatGPT</h2>
        <div id="error" class="error hidden"></div>
        <div id="chatgpt-details" class="hidden">
          <!-- Tipo de Plano -->
          <div class="plan-badge">
            <span id="plan-type">Plano: --</span>
          </div>

          <!-- Limite 5 Horas -->
          <div class="usage-section">
            <h2>Limite 5 Horas</h2>
            <div class="usage-bar-container">
              <div id="primary-bar" class="usage-bar"></div>
            </div>
            <div class="usage-details">
              <span id="primary-percent" class="usage-percent">0%</span>
              <span id="primary-reset" class="reset-time">Reset: --</span>
            </div>
          </div>

          <!-- Limite 7 Dias -->
          <div class="usage-section">
            <h2>Limite 7 Dias</h2>
            <div class="usage-bar-container">
              <div id="secondary-bar" class="usage-bar"></div>
            </div>
            <div class="usage-details">
              <span id="secondary-percent" class="usage-percent">0%</span>
              <span id="secondary-reset" class="reset-time">Reset: --</span>
            </div>
          </div>

          <!-- Créditos -->
          <div id="credits-section" class="usage-section hidden">
            <h2>Créditos</h2>
            <div class="credits-info">
              <span class="credit-label">Saldo:</span>
              <span id="credit-balance" class="credit-value">0</span>
            </div>
          </div>

          <div class="footer">
            <span id="last-updated">Atualizado: --</span>
          </div>
        </div>
      </section>

      <section class="provider-section" aria-labelledby="claude-title">
        <h2 id="claude-title" class="provider-title">Claude</h2>
        <div id="claude-error" class="error hidden"></div>
        <div id="claude-details" class="hidden">
          <div class="usage-section">
            <h2>Limite 5 Horas</h2>
            <div class="usage-bar-container"><div id="claude-primary-bar" class="usage-bar"></div></div>
            <div class="usage-details">
              <span id="claude-primary-percent" class="usage-percent">--</span>
              <span id="claude-primary-reset" class="reset-time">Reset: --</span>
            </div>
          </div>
          <div class="usage-section">
            <h2>Limite 7 Dias</h2>
            <div class="usage-bar-container"><div id="claude-secondary-bar" class="usage-bar"></div></div>
            <div class="usage-details">
              <span id="claude-secondary-percent" class="usage-percent">--</span>
              <span id="claude-secondary-reset" class="reset-time">Reset: --</span>
            </div>
          </div>
          <div class="footer"><span id="claude-last-updated">Atualizado: --</span></div>
        </div>
      </section>

      <!-- LGPD: Controles de Privacidade -->
      <div class="privacy-section">
        <h3>Privacidade (LGPD)</h3>
        <p class="retention-info" id="retention-info">Dados mantidos por 30 dias</p>
        <div class="privacy-buttons">
          <button id="export-data" class="privacy-btn export-btn">Exportar Dados</button>
          <button id="delete-data" class="privacy-btn delete-btn">Deletar Tudo</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
