<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920" role="img" aria-labelledby="title description">
  <title id="title">AI Usage Monitor V1.0.1</title>
  <desc id="description">Exemplo do popup da extensao com Claude selecionado e limites de uso exibidos.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4caf50"/>
      <stop offset="1" stop-color="#72cf76"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffc107"/>
      <stop offset="1" stop-color="#ffdc5d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0d0d0d" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="760" height="920" fill="#ece9e1"/>
  <rect x="112" y="56" width="536" height="808" rx="16" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="112" y="56" width="536" height="88" rx="16" fill="#343434"/>
  <rect x="112" y="127" width="536" height="17" fill="#343434"/>
  <text x="148" y="111" fill="#f4f4f2" font-family="Arial, sans-serif" font-size="29" font-weight="700">AI Usage</text>
  <rect x="494" y="79" width="42" height="38" rx="7" fill="#434343" stroke="#5c5c5c"/>
  <text x="505" y="106" fill="#e5e5e5" font-family="Arial, sans-serif" font-size="22">&#9881;</text>
  <rect x="548" y="79" width="64" height="38" rx="7" fill="#434343" stroke="#5c5c5c"/>
  <text x="558" y="105" fill="#e5e5e5" font-family="Arial, sans-serif" font-size="15">Dark</text>
  <text x="148" y="181" fill="#d5d5d5" font-family="Arial, sans-serif" font-size="16" font-weight="700">Servico</text>
  <rect x="148" y="197" width="464" height="44" rx="6" fill="#3a3a3a" stroke="#5a5a5a"/>
  <text x="164" y="225" fill="#f0f0f0" font-family="Arial, sans-serif" font-size="18">Claude</text>
  <path d="M585 213l10 10 10-10" fill="none" stroke="#d5d5d5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="148" y="268" width="464" height="42" rx="21" fill="#1f3a2e"/>
  <text x="380" y="294" text-anchor="middle" fill="#78d47b" font-family="Arial, sans-serif" font-size="15" font-weight="700">PLANO: PRO</text>
  <text x="148" y="356" fill="#cacaca" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">LIMITE 5 HORAS</text>
  <rect x="148" y="375" width="464" height="28" rx="14" fill="#464646"/>
  <rect x="148" y="375" width="195" height="28" rx="14" fill="url(#green)"/>
  <text x="148" y="432" fill="#71c976" font-family="Arial, sans-serif" font-size="22" font-weight="700">42%</text>
  <text x="612" y="432" text-anchor="end" fill="#a6a6a6" font-family="Arial, sans-serif" font-size="15">Reset: 2h 18m</text>
  <text x="148" y="505" fill="#cacaca" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">LIMITE 7 DIAS</text>
  <rect x="148" y="524" width="464" height="28" rx="14" fill="#464646"/>
  <rect x="148" y="524" width="84" height="28" rx="14" fill="url(#yellow)"/>
  <text x="148" y="581" fill="#f3c63c" font-family="Arial, sans-serif" font-size="22" font-weight="700">18%</text>
  <text x="612" y="581" text-anchor="end" fill="#a6a6a6" font-family="Arial, sans-serif" font-size="15">Reset: 4d 8h</text>
  <rect x="148" y="629" width="464" height="116" rx="9" fill="#292929" stroke="#454545"/>
  <text x="168" y="662" fill="#dedede" font-family="Arial, sans-serif" font-size="16" font-weight="700">Privacidade (LGPD)</text>
  <text x="168" y="690" fill="#999999" font-family="Arial, sans-serif" font-size="14">Dados mantidos por 30 dias</text>
  <rect x="168" y="706" width="203" height="26" rx="4" fill="#2196f3"/>
  <rect x="389" y="706" width="203" height="26" rx="4" fill="#f44336"/>
  <text x="270" y="725" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Exportar Dados</text>
  <text x="491" y="725" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Deletar Tudo</text>
  <line x1="148" y1="777" x2="612" y2="777" stroke="#484848"/>
  <text x="380" y="807" text-anchor="middle" fill="#858585" font-family="Arial, sans-serif" font-size="14">Atualizado: agora</text>
  <text x="380" y="895" text-anchor="middle" fill="#5e5b55" font-family="Arial, sans-serif" font-size="14">Exemplo visual, sem dados reais</text>
</svg>
